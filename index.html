<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المعمل الفريد - إدارة المعمل</title>
<style>
:root{--t:#0f766e;--td:#0b5a54;--tl:#e6f4f2;--r:#c62828;--bg:#f4f7f7;--b:#d5e0df;--tx:#1b2b2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--t);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header small{opacity:.85;display:block;font-weight:normal;font-size:12px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:52px;z-index:4}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-size:15px;color:#4a5f5d;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--t);border-color:var(--t);font-weight:bold}
main{max-width:900px;margin:0 auto;padding:14px 12px 80px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--b);border-radius:8px;width:100%;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--t);border-color:var(--t)}
label{display:block;font-size:13px;color:#4a5f5d;margin:8px 0 3px}
.btn{border:0;background:var(--t);color:#fff;padding:10px 16px;border-radius:9px;font:inherit;cursor:pointer;font-size:15px}
.btn:active{background:var(--td)}
.btn.s{background:#fff;color:var(--t);border:1px solid var(--t)}
.btn.d{background:#fff;color:var(--r);border:1px solid var(--r)}
.btn.w{background:#1fa855}
.btn.sm{padding:6px 10px;font-size:13px}
h2{font-size:18px;margin:6px 0 10px;color:var(--td)}
h3{font-size:15px;margin:12px 0 6px;color:var(--td)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.item b{display:block}.muted{color:#6b7f7d;font-size:13px}
.tag{display:inline-block;background:var(--tl);color:var(--td);border-radius:20px;padding:2px 10px;font-size:12px}
.hi{color:var(--r);font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--b);text-align:right}
th{background:var(--tl);color:var(--td)}
td.l,th.l{direction:ltr;text-align:left}
table.ltr{direction:ltr}table.ltr td,table.ltr th{overflow-wrap:break-word;padding:7px 5px}table.ltr th,table.ltr td{text-align:left}
.fab{position:fixed;bottom:16px;left:16px;z-index:6;border-radius:30px;padding:14px 20px;box-shadow:0 3px 10px #0004}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.modal>div{background:#fff;border-radius:14px;padding:14px;width:100%;max-width:560px;margin:auto}
.chk{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid #eef3f3;cursor:pointer}
.chk input{width:20px;height:20px;flex:none}
.chk span.n{flex:1}
details{margin-bottom:6px}summary{padding:9px;background:var(--tl);border-radius:8px;cursor:pointer;color:var(--td);font-weight:bold}
.res{display:grid;grid-template-columns:1fr 130px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #eef3f3}
.res input{direction:ltr;text-align:left}
.res.hi input{border-color:var(--r);color:var(--r)}
.empty{text-align:center;color:#6b7f7d;padding:30px 10px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:50;font-size:14px}
#pv{max-width:100%;border:1px solid var(--b);margin-bottom:8px}
@media(min-width:700px){.res{grid-template-columns:1fr 200px}}
.sg{margin-top:6px;padding:4px}.sgi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--b);background:#fff;padding:10px 6px;font:inherit;text-align:right;cursor:pointer}.sgi:last-child{border-bottom:0}.sgi .n{direction:ltr;font-weight:bold;font-size:14px;text-align:left;flex:1}.sgi .muted{font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<header><h1>المعمل الفريد<small>للتحاليل الطبية الكيميائية</small></h1><button class="btn s sm" id="hb" style="display:none" onclick="go('patients')">الرئيسية</button></header>
<div style="background:#fff3cd;color:#6b5300;text-align:center;padding:6px 8px;font-size:14px;font-weight:bold">نسخة تجريبية على الموبايل: بيانات وهمية بس. البيانات هنا على الجهاز ده فقط ومش متزامنة مع الكمبيوتر</div><nav id="nav"></nav>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal"></div>

<script src="app.js?v=28"></script>
<script src="app2.js?v=28"></script>

<div style="text-align:center;font-size:12px;color:#888;padding:8px 0 70px">v2.6 · <a href="#" onclick="refreshNeo();return false" style="color:#f47a2e">تحديث نطاقات الأطفال</a></div></body>
</html>
