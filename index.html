<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المعمل الفريد - إدارة المعمل</title>
<style>
:root{--t:#0f766e;--td:#0b5a54;--tl:#e6f4f2;--r:#c62828;--bg:#f4f7f7;--b:#d5e0df;--tx:#1b2b2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--t);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header small{opacity:.85;display:block;font-weight:normal;font-size:12px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:52px;z-index:4}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-size:15px;color:#4a5f5d;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--t);border-color:var(--t);font-weight:bold}
main{max-width:900px;margin:0 auto;padding:14px 12px 80px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--b);border-radius:8px;width:100%;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--t);border-color:var(--t)}
label{display:block;font-size:13px;color:#4a5f5d;margin:8px 0 3px}
.btn{border:0;background:var(--t);color:#fff;padding:10px 16px;border-radius:9px;font:inherit;cursor:pointer;font-size:15px}
.btn:active{background:var(--td)}
.btn.s{background:#fff;color:var(--t);border:1px solid var(--t)}
.btn.d{background:#fff;color:var(--r);border:1px solid var(--r)}
.btn.w{background:#1fa855}
.btn.sm{padding:6px 10px;font-size:13px}
h2{font-size:18px;margin:6px 0 10px;color:var(--td)}
h3{font-size:15px;margin:12px 0 6px;color:var(--td)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.item b{display:block}.muted{color:#6b7f7d;font-size:13px}
.tag{display:inline-block;background:var(--tl);color:var(--td);border-radius:20px;padding:2px 10px;font-size:12px}
.hi{color:var(--r);font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--b);text-align:right}
th{background:var(--tl);color:var(--td)}
td.l,th.l{direction:ltr;text-align:left}
table.ltr{direction:ltr}table.ltr td,table.ltr th{overflow-wrap:break-word;padding:7px 5px}table.ltr th,table.ltr td{text-align:left}
.fab{position:fixed;bottom:16px;left:16px;z-index:6;border-radius:30px;padding:14px 20px;box-shadow:0 3px 10px #0004}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.modal>div{background:#fff;border-radius:14px;padding:14px;width:100%;max-width:560px;margin:auto}
.chk{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid #eef3f3;cursor:pointer}
.chk input{width:20px;height:20px;flex:none}
.chk span.n{flex:1}
details{margin-bottom:6px}summary{padding:9px;background:var(--tl);border-radius:8px;cursor:pointer;color:var(--td);font-weight:bold}
.res{display:grid;grid-template-columns:1fr 130px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #eef3f3}
.res input{direction:ltr;text-align:left}
.res.hi input{border-color:var(--r);color:var(--r)}
.empty{text-align:center;color:#6b7f7d;padding:30px 10px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:50;font-size:14px}
#pv{max-width:100%;border:1px solid var(--b);margin-bottom:8px}
@media(min-width:700px){.res{grid-template-columns:1fr 200px}}
</style>
</head>
<body>
<header><h1>المعمل الفريد<small>للتحاليل الطبية الكيميائية</small></h1><button class="btn s sm" id="hb" style="display:none" onclick="go('patients')">الرئيسية</button></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal"></div>

<script>
/* ============ بيانات أساسية ============ */
const KEY='alfarid_lab_v1';
const CATS={cbc:'صورة دم كاملة',sugar:'سكر',lip:'دهون',liv:'كبد',kid:'كلى وأملاح',thy:'غدة درقية',hor:'هرمونات وفيتامينات',inf:'مناعة والتهابات',coag:'سيولة وقلب',uri:'تحليل بول',sto:'تحليل براز',oth:'أخرى'};
// [cat,name,unit,low,high,lowF,highF]  أو للنصي: [cat,name,'','', '',...,normal]
const N=(c,n,u,l,h,lf,hf)=>({cat:c,name:n,type:'num',unit:u,low:l,high:h,lowF:lf??'',highF:hf??'',normal:'',price:0});
const T=(c,n,normal)=>({cat:c,name:n,type:'txt',unit:'',low:'',high:'',lowF:'',highF:'',normal:normal||'',price:0});
function seed(){
const a=[
N('cbc','Hemoglobin (Hb)','g/dL',13,17,12,15.5),N('cbc','RBCs','10^6/µL',4.5,5.5,4.1,5.1),N('cbc','Hematocrit (HCT)','%',40,50,36,46),
N('cbc','MCV','fL',80,100),N('cbc','MCH','pg',27,33),N('cbc','MCHC','g/dL',32,36),N('cbc','WBCs','10^3/µL',4,11),N('cbc','Platelets','10^3/µL',150,450),
N('cbc','Neutrophils','%',40,75),N('cbc','Lymphocytes','%',20,45),N('cbc','Monocytes','%',2,10),N('cbc','Eosinophils','%',1,6),N('cbc','Basophils','%',0,1),
N('cbc','ESR (1st hour)','mm/hr',0,15,0,20),N('cbc','Reticulocytes','%',0.5,2.5),T('cbc','Blood Group & Rh',''),
N('sugar','Fasting Blood Sugar (FBS)','mg/dL',70,100),N('sugar','2h Post-prandial (2hPP)','mg/dL',0,140),N('sugar','Random Blood Sugar (RBS)','mg/dL',70,140),N('sugar','HbA1c','%',4,5.6),
N('lip','Total Cholesterol','mg/dL',0,200),N('lip','Triglycerides','mg/dL',0,150),N('lip','HDL Cholesterol','mg/dL',40,100,50,100),N('lip','LDL Cholesterol','mg/dL',0,130),
N('liv','ALT (SGPT)','U/L',0,41,0,33),N('liv','AST (SGOT)','U/L',0,40,0,32),N('liv','Alkaline Phosphatase (ALP)','U/L',40,129),N('liv','GGT','U/L',8,61,5,36),
N('liv','Total Bilirubin','mg/dL',0.1,1.2),N('liv','Direct Bilirubin','mg/dL',0,0.3),N('liv','Albumin','g/dL',3.5,5.2),N('liv','Total Protein','g/dL',6.4,8.3),
N('kid','Urea','mg/dL',15,45),N('kid','BUN','mg/dL',7,20),N('kid','Creatinine','mg/dL',0.7,1.3,0.6,1.1),N('kid','Uric Acid','mg/dL',3.5,7.2,2.6,6),
N('kid','Sodium (Na)','mmol/L',135,145),N('kid','Potassium (K)','mmol/L',3.5,5.1),N('kid','Chloride (Cl)','mmol/L',98,107),N('kid','Calcium (Ca)','mg/dL',8.6,10.2),
N('kid','Phosphorus','mg/dL',2.5,4.5),N('kid','Magnesium (Mg)','mg/dL',1.7,2.2),
N('thy','TSH','µIU/mL',0.27,4.2),N('thy','Free T4','ng/dL',0.93,1.7),N('thy','Free T3','pg/mL',2,4.4),N('thy','Total T3','ng/dL',80,200),N('thy','Total T4','µg/dL',5.1,14.1),
N('hor','Prolactin','ng/mL',4,15.2,4.8,23.3),N('hor','Testosterone (Total)','ng/mL',2.49,8.36,0.06,0.82),N('hor','FSH','mIU/mL','','','',''),N('hor','LH','mIU/mL','','','',''),
N('hor','Estradiol (E2)','pg/mL','','','',''),N('hor','Progesterone','ng/mL','','','',''),N('hor','Vitamin D (25-OH)','ng/mL',30,100),N('hor','Vitamin B12','pg/mL',197,771),
N('hor','Ferritin','ng/mL',30,400,13,150),N('hor','Serum Iron','µg/dL',65,175,50,170),N('hor','TIBC','µg/dL',250,450),N('hor','Folate','ng/mL',4.6,18.7),N('hor','PSA (Total)','ng/mL',0,4),
N('inf','CRP','mg/L',0,5),N('inf','Rheumatoid Factor (RF)','IU/mL',0,14),N('inf','ASO Titre','IU/mL',0,200),
T('inf','HBsAg','Negative'),T('inf','HCV Ab','Negative'),T('inf','HIV Ag/Ab','Negative'),T('inf','Widal Test',''),T('inf','H. pylori Ag (Stool)','Negative'),T('inf','Pregnancy Test (Urine/Serum)',''),
N('coag','Prothrombin Time (PT)','sec',11,13.5),N('coag','INR','',0.8,1.2),N('coag','aPTT','sec',25,35),N('coag','D-Dimer','µg/mL',0,0.5),N('coag','CK-MB','U/L',0,25),T('coag','Troponin I','Negative'),
T('uri','Urine - Color',''),T('uri','Urine - Appearance','Clear'),N('uri','Urine - pH','',5,8),N('uri','Urine - Specific Gravity','',1.005,1.03),
T('uri','Urine - Albumin','Negative'),T('uri','Urine - Sugar','Negative'),T('uri','Urine - Ketones','Negative'),T('uri','Urine - Blood','Negative'),T('uri','Urine - Bilirubin','Negative'),T('uri','Urine - Nitrite','Negative'),
N('uri','Urine - Pus cells','/HPF',0,5),N('uri','Urine - RBCs','/HPF',0,2),T('uri','Urine - Epithelial cells','Few'),T('uri','Urine - Casts','Nil'),T('uri','Urine - Crystals','Nil'),T('uri','Urine - Bacteria','Nil'),
T('sto','Stool - Color',''),T('sto','Stool - Consistency','Formed'),T('sto','Stool - Mucus','Nil'),T('sto','Stool - Occult Blood','Negative'),
N('sto','Stool - Pus cells','/HPF',0,5),N('sto','Stool - RBCs','/HPF',0,2),T('sto','Stool - Parasites / Ova / Cysts','Not found'),T('sto','Stool - Culture',''),
T('oth','Semen Analysis',''),T('oth','Culture & Sensitivity','')];
a.forEach((x,i)=>x.id='t'+(i+1));return a}

let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.patients)return s}catch(e){}
 return {patients:[],visits:[],tests:seed(),settings:{name:'المعمل الفريد للتحاليل الطبية الكيميائية',phone:'01224054573',hours:'مواعيد العمل: يوميًا من 8 ص إلى 9 م',owner:'د. عاطف عبيد حليم',footer:'النتائج تُفسَّر بواسطة الطبيب المعالج مع الحالة الإكلينيكية.'},seq:1000}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('المساحة ممتلئة. اعمل نسخة احتياطية الأول.')}}
const uid=p=>p+(++S.seq).toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=d=>{const [y,m,dd]=(d||'').split('-');return dd?dd+'/'+m+'/'+y:''};
const gl=g=>g==='F'?'أنثى':g==='M'?'ذكر':'';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function waNum(p){p=String(p||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('20')&&p.length>=12)return p;if(p.startsWith('0'))return '20'+p.slice(1);if(p.length===10&&p[0]==='1')return '20'+p;return p}

/* ============ مرجع النتائج ============ */
function range(it,g){let l=it.low,h=it.high;if(g==='F'&&(it.lowF!==''||it.highF!=='')){l=it.lowF;h=it.highF}return[l,h]}
function refText(it,g){if(it.type==='txt')return it.normal||'';const[l,h]=range(it,g);if(l===''&&h==='')return it.refNote||'';if(l===''||l===null)return '< '+h;if(h===''||h===null)return '> '+l;if(+l===0&&+h>0)return '< '+h;return l+' - '+h}
function flag(it,g){const v=String(it.value??'').trim();if(!v)return '';
 if(it.type==='txt'){if(!it.normal)return '';return v.toLowerCase()===it.normal.toLowerCase()?'':'*'}
 const x=parseFloat(v.replace(',','.'));if(isNaN(x))return '';const[l,h]=range(it,g);
 if(l!==''&&x<+l)return 'L';if(h!==''&&x>+h)return 'H';return ''}

/* ============ تنقل ============ */
let V={n:'patients'};
function go(n,p){V={n,...p};render();window.scrollTo(0,0)}
function render(){
 const tabs=[['patients','المرضى'],['catalog','التحاليل'],['settings','الإعدادات']];
 const act=['patient','visit','edit','view'].includes(V.n)?'patients':V.n;
 $('nav').innerHTML=tabs.map(([k,l])=>`<button class="${act===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 ({patients:vPatients,patient:vPatient,edit:vEdit,view:vView,catalog:vCatalog,settings:vSettings})[V.n]();
}

/* ============ المرضى ============ */
function vPatients(){
 $('app').innerHTML=`<div class="row"><input class="grow" id="q" placeholder="ابحث بالاسم أو رقم التليفون" oninput="listP()"><button class="btn" onclick="pForm()">+ مريض جديد</button></div>
 <div class="muted" style="margin:8px 2px" id="cnt"></div><div id="pl"></div>`;listP()}
function listP(){const q=($('q')?.value||'').trim().toLowerCase();
 let a=S.patients.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.phone||'').includes(q));
 const last=p=>S.visits.filter(v=>v.pid===p.id).map(v=>v.date).sort().pop()||'';
 a.sort((x,y)=>(last(y)||y.created).localeCompare(last(x)||x.created));
 $('cnt').textContent=S.patients.length+' مريض'+(q?' - النتيجة: '+a.length:'');
 $('pl').innerHTML=a.length?a.map(p=>{const n=S.visits.filter(v=>v.pid===p.id).length;
 return `<div class="card item" onclick="go('patient',{id:'${p.id}'})"><div><b>${esc(p.name)}</b><span class="muted">${esc(p.phone||'بدون رقم')} ${p.age?' - '+esc(p.age)+' سنة':''} ${gl(p.gender)?' - '+gl(p.gender):''}</span></div><span class="tag">${n} زيارة</span></div>`}).join(''):`<div class="empty">${S.patients.length?'مفيش نتائج':'لسه مفيش مرضى. دوس "مريض جديد" وابدأ.'}</div>`}
function pForm(id){const p=S.patients.find(x=>x.id===id)||{};
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div><h2>${id?'تعديل بيانات المريض':'مريض جديد'}</h2>
 <label>الاسم *</label><input id="fn" value="${esc(p.name||'')}">
 <label>رقم التليفون (واتساب)</label><input id="fp" type="tel" inputmode="tel" value="${esc(p.phone||'')}" placeholder="01xxxxxxxxx">
 <div class="row"><div class="grow"><label>السن</label><input id="fa" type="number" inputmode="numeric" value="${esc(p.age||'')}"></div>
 <div class="grow"><label>النوع</label><select id="fg"><option value="M" ${p.gender!=='F'?'selected':''}>ذكر</option><option value="F" ${p.gender==='F'?'selected':''}>أنثى</option></select></div></div>
 <label>ملاحظات</label><input id="fno" value="${esc(p.note||'')}">
 <div class="row" style="margin-top:14px"><button class="btn grow" onclick="pSave('${id||''}')">حفظ</button><button class="btn s" onclick="closeM()">إلغاء</button></div></div></div>`;$('fn').focus()}
function closeM(){$('modal').innerHTML=''}
function pSave(id){const name=$('fn').value.trim();if(!name){toast('اكتب الاسم');return}
 const d={name,phone:$('fp').value.trim(),age:$('fa').value.trim(),gender:$('fg').value,note:$('fno').value.trim()};
 if(id)Object.assign(S.patients.find(x=>x.id===id),d);else{d.id=uid('p');d.created=today();S.patients.push(d);id=d.id}
 save();closeM();go('patient',{id})}
function vPatient(){const p=S.patients.find(x=>x.id===V.id);if(!p)return go('patients');
 const vs=S.visits.filter(v=>v.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date));
 $('app').innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(p.name)}</h2>
 <div class="muted">${esc(p.phone||'بدون رقم')} ${p.age?' - '+esc(p.age)+' سنة':''} - ${gl(p.gender)}</div>${p.note?`<div class="muted">${esc(p.note)}</div>`:''}
 <div class="row" style="margin-top:10px"><button class="btn" onclick="go('edit',{pid:'${p.id}'})">+ زيارة / تحاليل جديدة</button>
 <button class="btn s sm" onclick="pForm('${p.id}')">تعديل البيانات</button><button class="btn d sm" onclick="pDel('${p.id}')">حذف المريض</button></div></div>
 <h3>سجل الزيارات (${vs.length})</h3>${vs.length?vs.map(v=>`<div class="card item" onclick="go('view',{id:'${v.id}'})"><div><b>${fd(v.date)}</b><span class="muted">${v.items.map(i=>esc(i.name)).slice(0,4).join('، ')}${v.items.length>4?' ...':''}</span></div><span class="tag">${v.items.length} تحليل${v.items.some(i=>flag(i,p.gender))?' ⚠':''}</span></div>`).join(''):'<div class="empty">مفيش زيارات لسه</div>'}
 ${trend(p,vs)}`}
function trend(p,vs){ // مقارنة آخر قيم لنفس التحليل
 if(vs.length<2)return '';const m={};vs.forEach(v=>v.items.forEach(i=>{if(i.type==='num'&&i.value!=='')(m[i.name]=m[i.name]||[]).push([v.date,i.value,flag(i,p.gender)])}));
 const k=Object.keys(m).filter(x=>m[x].length>1);if(!k.length)return '';
 return `<h3>تطور التحاليل المتكررة</h3><div class="card"><table><tr><th>التحليل</th><th>النتائج (الأحدث أولًا)</th></tr>${k.map(n=>`<tr><td class="l">${esc(n)}</td><td class="l">${m[n].slice(0,6).map(x=>`<span class="${x[2]?'hi':''}">${esc(x[1])}</span>`).join(' ← ')}</td></tr>`).join('')}</table></div>`}
function pDel(id){if(!confirm('تحذف المريض وكل نتايجه؟ مينفعش ترجعها (إلا من نسخة احتياطية).'))return;
 S.patients=S.patients.filter(p=>p.id!==id);S.visits=S.visits.filter(v=>v.pid!==id);save();go('patients')}

/* ============ إدخال زيارة ============ */
let D=null; // مسودة
function vEdit(){
 if(!D||D.key!==(V.id||'n'+V.pid)){const v=V.id&&S.visits.find(x=>x.id===V.id);
  D=v?{key:V.id,id:v.id,pid:v.pid,date:v.date,notes:v.notes||'',paid:v.paid||'',disc:v.disc||'',items:JSON.parse(JSON.stringify(v.items))}:{key:'n'+V.pid,pid:V.pid,date:today(),notes:'',paid:'',disc:'',items:[]}}
 const p=S.patients.find(x=>x.id===D.pid);
 $('app').innerHTML=`<div class="card"><b>${esc(p.name)}</b> <span class="muted">${p.age?p.age+' سنة - ':''}${gl(p.gender)}</span>
 <label>تاريخ الزيارة</label><input type="date" id="dd" value="${D.date}" onchange="D.date=this.value"></div>
 <h3>١) اختار التحاليل</h3><input id="tq" placeholder="ابحث عن تحليل (CBC, سكر, TSH ...)" oninput="pick()"><div id="pk" style="margin-top:8px"></div>
 <h3>٢) النتائج</h3><div class="card" id="rs"></div>
 <div class="card"><label>ملاحظات تظهر في التقرير</label><textarea id="nt" rows="2" oninput="D.notes=this.value">${esc(D.notes)}</textarea>
 <div class="row"><div class="grow"><label>خصم (جنيه)</label><input type="number" inputmode="decimal" value="${esc(D.disc)}" oninput="D.disc=this.value;tot()"></div><div class="grow"><label>المدفوع (جنيه)</label><input type="number" inputmode="decimal" value="${esc(D.paid)}" oninput="D.paid=this.value;tot()"></div></div>
 <div id="tt" style="margin-top:8px;font-weight:bold"></div></div>
 <div class="row"><button class="btn grow" onclick="vSave()">حفظ وعرض التقرير</button><button class="btn s" onclick="D=null;go('patient',{id:'${p.id}'})">إلغاء</button></div>`;
 pick();rs();tot()}
function pick(){const q=($('tq')?.value||'').trim().toLowerCase();const sel=new Set(D.items.map(i=>i.tid));
 const groups=Object.keys(CATS).map(c=>({c,l:S.tests.filter(t=>t.cat===c&&(!q||t.name.toLowerCase().includes(q)||CATS[c].includes(q)))})).filter(g=>g.l.length);
 $('pk').innerHTML=groups.map(g=>`<details ${q||g.l.some(t=>sel.has(t.id))?'open':''}><summary>${CATS[g.c]} (${g.l.length})</summary><div class="card" style="margin:4px 0">${g.l.map(t=>`<label class="chk"><input type="checkbox" ${sel.has(t.id)?'checked':''} onchange="tog('${t.id}',this.checked)"><span class="n" style="direction:ltr;text-align:right">${esc(t.name)}</span>${t.price?`<span class="muted">${t.price} ج</span>`:''}</label>`).join('')}</div></details>`).join('')||'<div class="empty">مفيش تحليل بالاسم ده. ضيفه من تبويب التحاليل.</div>'}
function tog(id,on){if(on){const t=S.tests.find(x=>x.id===id);D.items.push({tid:t.id,name:t.name,cat:t.cat,type:t.type,unit:t.unit,low:t.low,high:t.high,lowF:t.lowF,highF:t.highF,normal:t.normal,price:t.price,value:t.type==='txt'?(t.normal||''):''})}
 else D.items=D.items.filter(i=>i.tid!==id);rs();tot()}
function rs(){const p=S.patients.find(x=>x.id===D.pid);
 $('rs').innerHTML=D.items.length?D.items.map((i,k)=>`<div class="res ${flag(i,p.gender)?'hi':''}" id="rr${k}"><div><span style="direction:ltr;display:block;text-align:right">${esc(i.name)}</span><span class="muted" style="direction:ltr;display:block;text-align:right">${esc(refText(i,p.gender))} ${esc(i.unit)}</span></div>
 <input value="${esc(i.value)}" placeholder="النتيجة" ${i.type==='num'?'inputmode="decimal"':''} oninput="D.items[${k}].value=this.value;document.getElementById('rr${k}').classList.toggle('hi',!!flag(D.items[${k}],'${p.gender}'))"></div>`).join(''):'<div class="empty">اختار تحاليل من فوق</div>'}
function sum(it){return it.reduce((a,i)=>a+(+i.price||0),0)}
function tot(){const s=sum(D.items),d=+D.disc||0,n=s-d,pd=+D.paid||0;if($('tt'))$('tt').textContent=s?`الإجمالي ${s} - الخصم ${d} = ${n} ج | المتبقي ${n-pd} ج`:''}
function vSave(){if(!D.items.length){toast('اختار تحليل واحد على الأقل');return}
 const v={id:D.id||uid('v'),pid:D.pid,date:D.date||today(),notes:D.notes,paid:D.paid,disc:D.disc,items:D.items};
 const i=S.visits.findIndex(x=>x.id===v.id);if(i>=0)S.visits[i]=v;else S.visits.push(v);save();D=null;go('view',{id:v.id})}

/* ============ عرض زيارة ============ */
function vView(){const v=S.visits.find(x=>x.id===V.id);if(!v)return go('patients');const p=S.patients.find(x=>x.id===v.pid);
 const cats=Object.keys(CATS).filter(c=>v.items.some(i=>(i.cat||'oth')===c));const s=sum(v.items),n=s-(+v.disc||0);
 $('app').innerHTML=`<div class="card"><b>${esc(p.name)}</b> <span class="muted">${p.age?p.age+' سنة - ':''}${gl(p.gender)} - ${fd(v.date)}</span>
 <div class="row" style="margin-top:10px"><button class="btn w" onclick="report('${v.id}')">📄 تقرير PDF / واتساب</button><button class="btn s sm" onclick="go('edit',{id:'${v.id}',pid:'${p.id}'})">تعديل النتائج</button><button class="btn s sm" onclick="go('patient',{id:'${p.id}'})">ملف المريض</button><button class="btn d sm" onclick="vDel('${v.id}')">حذف</button></div></div>
 <div class="card" style="overflow-x:auto;direction:ltr"><table class="ltr"><tr><th class="l">Test</th><th class="l">Result</th><th class="l">Unit</th><th class="l">Reference</th></tr>
 ${cats.map(c=>`<tr><td colspan="4" style="background:#f4f7f7;font-weight:bold;color:var(--td)">${CATS[c]}</td></tr>`+v.items.filter(i=>(i.cat||'oth')===c).map(i=>{const f=flag(i,p.gender);return `<tr><td class="l">${esc(i.name)}</td><td class="l ${f?'hi':''}">${esc(i.value)||'-'} ${f==='H'?'▲':f==='L'?'▼':f?'●':''}</td><td class="l">${esc(i.unit)}</td><td class="l">${esc(refText(i,p.gender))}</td></tr>`}).join('')).join('')}</table></div>
 ${v.notes?`<div class="card"><b>ملاحظات:</b> ${esc(v.notes)}</div>`:''}${s?`<div class="card muted">الإجمالي ${s} - الخصم ${+v.disc||0} = <b>${n} ج</b> | المدفوع ${+v.paid||0} | المتبقي ${n-(+v.paid||0)}</div>`:''}`}
function vDel(id){if(!confirm('تحذف الزيارة دي؟'))return;const v=S.visits.find(x=>x.id===id);S.visits=S.visits.filter(x=>x.id!==id);save();go('patient',{id:v.pid})}

/* ============ كتالوج التحاليل ============ */
function vCatalog(){
 $('app').innerHTML=`<div class="row"><input class="grow" id="cq" placeholder="ابحث في التحاليل" oninput="listC()"><button class="btn" onclick="tForm()">+ تحليل جديد</button></div><div id="cl" style="margin-top:10px"></div>`;listC()}
function listC(){const q=($('cq')?.value||'').trim().toLowerCase();
 $('cl').innerHTML=Object.keys(CATS).map(c=>{const l=S.tests.filter(t=>t.cat===c&&(!q||t.name.toLowerCase().includes(q)));if(!l.length)return '';
 return `<details ${q?'open':''}><summary>${CATS[c]} (${l.length})</summary><div class="card" style="margin:4px 0"><table>${l.map(t=>`<tr onclick="tForm('${t.id}')" style="cursor:pointer"><td class="l">${esc(t.name)}</td><td class="l muted">${esc(refText(t,'M'))} ${esc(t.unit)}</td><td>${t.price?t.price+' ج':'<span class="muted">بدون سعر</span>'}</td></tr>`).join('')}</table></div></details>`}).join('')||'<div class="empty">مفيش نتائج</div>'}
function tForm(id){const t=S.tests.find(x=>x.id===id)||{cat:'oth',type:'num',unit:'',low:'',high:'',lowF:'',highF:'',normal:'',price:''};
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div><h2>${id?'تعديل تحليل':'تحليل جديد'}</h2>
 <label>اسم التحليل *</label><input id="tn" dir="ltr" value="${esc(t.name||'')}">
 <div class="row"><div class="grow"><label>القسم</label><select id="tc">${Object.entries(CATS).map(([k,l])=>`<option value="${k}" ${t.cat===k?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="grow"><label>السعر (جنيه)</label><input id="tpr" type="number" inputmode="decimal" value="${esc(t.price)}"></div></div>
 <label>نوع النتيجة</label><select id="ty" onchange="tt()"><option value="num" ${t.type==='num'?'selected':''}>رقم (له مدى طبيعي)</option><option value="txt" ${t.type==='txt'?'selected':''}>كلام (Positive / Negative ...)</option></select>
 <div id="tn1"><div class="row"><div class="grow"><label>الوحدة</label><input id="tu" dir="ltr" value="${esc(t.unit)}"></div></div>
 <div class="row"><div class="grow"><label>الحد الأدنى</label><input id="tl" type="number" step="any" value="${esc(t.low)}"></div><div class="grow"><label>الحد الأعلى</label><input id="th" type="number" step="any" value="${esc(t.high)}"></div></div>
 <div class="muted" style="margin-top:8px">لو المدى مختلف للسيدات، اكتبه هنا (اختياري):</div>
 <div class="row"><div class="grow"><label>أدنى (سيدات)</label><input id="tlf" type="number" step="any" value="${esc(t.lowF)}"></div><div class="grow"><label>أعلى (سيدات)</label><input id="thf" type="number" step="any" value="${esc(t.highF)}"></div></div></div>
 <div id="tn2"><label>القيمة الطبيعية (تظهر تلقائي، وأي اختلاف يتعلّم)</label><input id="tno" value="${esc(t.normal)}" placeholder="Negative"></div>
 <div class="row" style="margin-top:14px"><button class="btn grow" onclick="tSave('${id||''}')">حفظ</button>${id?`<button class="btn d" onclick="tDel('${id}')">حذف</button>`:''}<button class="btn s" onclick="closeM()">إلغاء</button></div></div></div>`;tt();if(!id)$('tn').focus()}
function tt(){const n=$('ty').value==='num';$('tn1').style.display=n?'':'none';$('tn2').style.display=n?'none':''}
function tSave(id){const name=$('tn').value.trim();if(!name){toast('اكتب اسم التحليل');return}
 const d={name,cat:$('tc').value,price:$('tpr').value===''?0:+$('tpr').value,type:$('ty').value,unit:$('tu').value.trim(),low:$('tl').value,high:$('th').value,lowF:$('tlf').value,highF:$('thf').value,normal:$('tno').value.trim()};
 if(d.type==='txt'){d.unit='';d.low=d.high=d.lowF=d.highF=''}else d.normal='';
 if(id)Object.assign(S.tests.find(x=>x.id===id),d);else{d.id=uid('t');S.tests.push(d)}save();closeM();listC();toast('تم الحفظ')}
function tDel(id){if(!confirm('تحذف التحليل من القائمة؟ النتائج القديمة مش هتتأثر.'))return;S.tests=S.tests.filter(x=>x.id!==id);save();closeM();listC()}

/* ============ الإعدادات والنسخ الاحتياطي ============ */
function vSettings(){const s=S.settings;
 $('app').innerHTML=`<div class="card"><h2 style="margin-top:0">بيانات المعمل (تظهر في التقرير)</h2>
 <label>اسم المعمل</label><input id="s1" value="${esc(s.name)}"><label>التليفون</label><input id="s2" value="${esc(s.phone)}"><label>مواعيد العمل</label><input id="s3" value="${esc(s.hours)}">
 <label>اسم المسؤول / الدكتور</label><input id="s4" value="${esc(s.owner)}"><label>سطر أسفل التقرير</label><input id="s5" value="${esc(s.footer)}">
 <button class="btn" style="margin-top:12px" onclick="sSave()">حفظ</button></div>
 <div class="card"><h2 style="margin-top:0">نسخة احتياطية</h2><div class="muted">البيانات متخزنة على الجهاز ده بس. للانتقال بين الأجهزة: احفظ نسخة، ابعتها لنفسك (واتساب)، وافتحها على الجهاز التاني بزر "دمج" (بيضيف الجديد بس من غير ما يمسح حاجة). اعمل نسخة احتياطية كل فترة، وابعتها لنفسك على واتساب. تقدر تفتحها على أي جهاز تاني.</div>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="exp()">⬇ حفظ نسخة احتياطية</button><button class="btn s" onclick="mrg=1;$('imp').click()">🔀 دمج نسخة من جهاز تاني</button><button class="btn s" onclick="mrg=0;$('imp').click()">⬆ استرجاع (استبدال)</button><input type="file" id="imp" accept=".json" style="display:none" onchange="imp(this)"></div>
 <div class="muted" style="margin-top:10px">${S.patients.length} مريض - ${S.visits.length} زيارة - ${S.tests.length} تحليل</div></div>
 <div class="card"><button class="btn d sm" onclick="rst()">إرجاع قائمة التحاليل للوضع الأصلي</button></div>`}
function sSave(){Object.assign(S.settings,{name:$('s1').value,phone:$('s2').value,hours:$('s3').value,owner:$('s4').value,footer:$('s5').value});save();toast('تم الحفظ')}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1500)}
function exp(){dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'alfarid-backup-'+today()+'.json');toast('تم تنزيل النسخة')}
let mrg=0;
function merge(d){const add=(k)=>{const ids=new Set(S[k].map(x=>x.id));d[k].forEach(x=>{if(!ids.has(x.id))S[k].push(x)})};add('patients');add('visits');add('tests');S.seq=Math.max(S.seq||0,d.seq||0)}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.patients||!d.visits||!d.tests)throw 0;
 if(mrg){merge(d);save();toast('تم الدمج');go('patients');el.value='';return}
 if(!confirm('هتستبدل كل البيانات الحالية ببيانات النسخة ('+d.patients.length+' مريض). متأكد؟'))return;S=d;save();toast('تم الاسترجاع');go('patients')}catch(e){alert('الملف ده مش نسخة احتياطية صحيحة')}};r.readAsText(f)}
function rst(){if(!confirm('هترجع قائمة التحاليل للأصل وتمسح تعديلاتك عليها (المرضى مش هيتأثروا). متأكد؟'))return;S.tests=seed();save();toast('تم')}

/* ============ التقرير: رسم على canvas ثم PDF ============ */
const W=1240,H=1754,TEAL='#0f766e',FONT='Tahoma,"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif';
function drawReport(v,p){const pages=[];let cv,c,y,pg=0;const s=S.settings;
 function txt(t,x,yy,o={}){c.font=(o.b?'bold ':'')+(o.s||26)+'px '+FONT;c.fillStyle=o.col||'#1b2b2a';c.textAlign=o.a||'right';c.direction=o.d||'rtl';c.fillText(String(t),x,yy)}
 function newPage(){cv=document.createElement('canvas');cv.width=W;cv.height=H;c=cv.getContext('2d');pages.push(cv);pg++;
  c.fillStyle='#fff';c.fillRect(0,0,W,H);c.fillStyle=TEAL;c.fillRect(0,0,W,190);c.fillStyle='#0b5a54';c.fillRect(0,190,W,10);
  txt(s.name,W/2,95,{a:'center',b:1,s:46,col:'#fff'});txt('Al-Farid Medical Chemical Laboratory',W/2,145,{a:'center',s:26,col:'#cdeae6',d:'ltr'});
  c.strokeStyle='#9fd0ca';c.lineWidth=2;c.beginPath();c.moveTo(60,H-110);c.lineTo(W-60,H-110);c.stroke();
  txt(s.hours+'   |   تليفون: '+s.phone,W/2,H-70,{a:'center',s:24,col:TEAL,b:1});txt(s.footer,W/2,H-32,{a:'center',s:20,col:'#6b7f7d'});
  y=230;
  if(pg===1){c.fillStyle='#e6f4f2';c.fillRect(60,y,W-120,120);
   txt('اسم المريض:',W-80,y+45,{s:24,col:'#4a5f5d'});txt(p.name,W-250,y+45,{b:1,s:30});
   txt('التاريخ:',500,y+45,{s:24,col:'#4a5f5d'});txt(fd(v.date),410,y+45,{b:1,s:28,d:'ltr',a:'right'});
   txt('السن:',W-80,y+95,{s:24,col:'#4a5f5d'});txt((p.age?p.age+' سنة':'-'),W-170,y+95,{b:1,s:26});
   txt('النوع:',W-420,y+95,{s:24,col:'#4a5f5d'});txt(gl(p.gender),W-500,y+95,{b:1,s:26});
   y+=150}
  headRow()}
 function headRow(){c.fillStyle=TEAL;c.fillRect(60,y,W-120,48);const f={s:23,b:1,col:'#fff',d:'ltr'};
  txt('Test',80,y+33,{...f,a:'left'});txt('Result',560,y+33,{...f,a:'left'});txt('Unit',790,y+33,{...f,a:'left'});txt('Reference range',960,y+33,{...f,a:'left'});y+=48}
 newPage();const limit=H-150;
 const cats=Object.keys(CATS).filter(k=>v.items.some(i=>(i.cat||'oth')===k));let alt=0;
 cats.forEach(k=>{if(y+44+50>limit){newPage()}
  c.fillStyle='#d3ebe8';c.fillRect(60,y,W-120,40);txt(CATS[k],80,y+29,{b:1,s:24,col:'#0b5a54',a:'left'});y+=40;
  v.items.filter(i=>(i.cat||'oth')===k).forEach(i=>{if(y+46>limit){newPage();}
   const f=flag(i,p.gender);if(alt++%2){c.fillStyle='#f6faf9';c.fillRect(60,y,W-120,46)}
   txt(i.name,80,y+32,{s:23,d:'ltr',a:'left'});
   const val=(i.value||'-')+(f==='H'?'  ▲':f==='L'?'  ▼':f?'  ●':'');
   txt(val,560,y+32,{s:25,b:!!f,col:f?'#c62828':'#1b2b2a',d:'ltr',a:'left'});
   txt(i.unit||'',790,y+32,{s:21,col:'#4a5f5d',d:'ltr',a:'left'});txt(refText(i,p.gender),960,y+32,{s:21,col:'#4a5f5d',d:'ltr',a:'left'});
   c.strokeStyle='#e3ecea';c.lineWidth=1;c.beginPath();c.moveTo(60,y+46);c.lineTo(W-60,y+46);c.stroke();y+=46})});
 if(v.items.some(i=>flag(i,p.gender))){y+=14;txt('▲ مرتفع   ▼ منخفض   ● غير طبيعي',W-80,y+20,{s:20,col:'#c62828'});y+=34}
 if(v.notes){if(y+110>limit)newPage();y+=14;c.fillStyle='#fff8e1';c.fillRect(60,y,W-120,80);txt('ملاحظات: '+v.notes,W-80,y+48,{s:24})}
 return pages}
/* PDF بسيط: كل صفحة صورة JPEG */
async function makePDF(pages){const enc=new TextEncoder();const parts=[];let off=0;const offs=[];
 const add=d=>{const b=typeof d==='string'?enc.encode(d):d;parts.push(b);off+=b.length};
 const objs=[];const n=pages.length;add('%PDF-1.4\n');
 const jpgs=[];for(const cv of pages){const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));jpgs.push(new Uint8Array(await b.arrayBuffer()))}
 const o=(i,body)=>{offs[i]=off;add(i+' 0 obj\n');if(typeof body==='string')add(body);else body();add('\nendobj\n')};
 o(1,'<< /Type /Catalog /Pages 2 0 R >>');
 o(2,'<< /Type /Pages /Count '+n+' /Kids ['+pages.map((_,k)=>(3+k*3)+' 0 R').join(' ')+'] >>');
 pages.forEach((_,k)=>{const pid=3+k*3,cid=pid+1,iid=pid+2;
  o(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>');
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';o(cid,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  o(iid,()=>{add('<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpgs[k].length+' >>\nstream\n');add(jpgs[k]);add('\nendstream')})});
 const xo=off,tot=3+n*3;add('xref\n0 '+tot+'\n0000000000 65535 f \n');for(let i=1;i<tot;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 add('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
let RP=null;
async function report(id){const v=S.visits.find(x=>x.id===id),p=S.patients.find(x=>x.id===v.pid);
 toast('بجهّز التقرير...');const pages=drawReport(v,p);const blob=await makePDF(pages);
 const fname=(p.name.replace(/[\\/:*?"<>|]/g,'')+'_'+v.date+'.pdf');RP={blob,fname,p,v};
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div><h2>تقرير ${esc(p.name)}</h2>
 ${pages.map((cv,k)=>`<img id="pv" alt="صفحة ${k+1}" src="${cv.toDataURL('image/jpeg',0.8)}">`).join('')}
 <div class="row"><button class="btn w grow" onclick="waChat()">📲 فتح واتساب المريض</button></div>
 <div class="row" style="margin-top:8px"><button class="btn s grow" onclick="shareR()">مشاركة الملف (اختار المريض بنفسك)</button><button class="btn s" onclick="dl(RP.blob,RP.fname)">⬇ تنزيل PDF</button><button class="btn s" onclick="closeM()">إغلاق</button></div>
 <div class="muted" style="margin-top:8px">"فتح واتساب المريض": بينزل ملف PDF وبيفتح محادثة المريض برقمه المسجل على طول، وانت بس ترفق الملف (📎 مستند واختار الملف). لو مفيش رقم مسجل بيفتح قايمة المشاركة.</div></div></div>`}
function greet(d){d=d||new Date();return d.getHours()<12?'صباح الخير':'مساء الخير'}
function waChat(){const{blob,fname,p,v}=RP;const n=waNum(p.phone);if(n.length<11){toast('مفيش رقم تليفون مسجل للمريض');shareR();return}
 const msg=greet()+' يا أفندم\nنتيجة تحاليلك من '+S.settings.name+' بتاريخ '+fd(v.date)+'.\nتليفون: '+S.settings.phone;
 dl(blob,fname);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');toast('الملف نزل. ارفقه في المحادثة 📎')}
async function shareR(){const{blob,fname,p,v}=RP;const msg=greet()+' يا أفندم\nنتيجة تحاليلك من '+S.settings.name+' بتاريخ '+fd(v.date)+'.\nتليفون: '+S.settings.phone;
 const file=new File([blob],fname,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:msg,title:fname});return}catch(e){if(e.name==='AbortError')return}}
 dl(blob,fname);const n=waNum(p.phone);setTimeout(()=>window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank'),600);
 toast('الملف نزل. ارفعه في محادثة واتساب المريض')}

render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
